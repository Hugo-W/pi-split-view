name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm >= 11.5.0 is required for OIDC trusted publishing
      - run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$TAG" != "v$(node -p "require('./package.json').version")" ]; then
            echo "Tag $TAG does not match package.json version"; exit 1
          fi

      - run: npm publish
